  <path d="M 28 82 C 22 42, 60 22, 90 32" stroke="#54b4de" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 6"/>

  <!-- Main pencil-curved shaft -->
  <path d="M 22 78 C 16 34, 62 14, 94 34" stroke="#383838" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Hand-drawn arrowhead with sunny marigold fill -->
