  <!-- Energy sparks near destination -->
  <path d="M 104 14 L 108 8" stroke="#383838" stroke-width="2" stroke-linecap="round"/>
  <path d="M 112 24 L 118 22" stroke="#54b4de" stroke-width="2" stroke-linecap="round"/>
  <path d="M 106 46 L 112 50" stroke="#383838" stroke-width="2" stroke-linecap="round"/>
