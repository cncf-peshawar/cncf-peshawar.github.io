<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" aria-hidden="true">
  <title>CNCF Peshawar snow leopard mascot</title>

  <!-- Speed / motion lines (trailing flight) -->
  <path d="M 14 156 L 30 146" stroke="#54b4de" stroke-width="2" stroke-linecap="round"/>
  <path d="M 22 166 L 44 154" stroke="#383838" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 12 96 L 24 92" stroke="#54b4de" stroke-width="2" stroke-linecap="round"/>
  <path d="M 20 44 L 32 40" stroke="#383838" stroke-width="2" stroke-linecap="round"/>

  <!-- TAIL (Streaming behind in a magnificent undulating S-curve) -->
  <path d="M 64 116
           C 42 108, 20 94, 16 74
           C 12 50, 30 40, 42 46
           C 50 52, 44 68, 32 76
           C 30 90, 48 104, 70 110 Z"
        fill="#ffffff"
        stroke="#383838"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <!-- Tail spots along motion -->
  <ellipse cx="38" cy="54" rx="2.5" ry="3" fill="#383838"/>
  <ellipse cx="26" cy="74" rx="2.5" ry="3.5" fill="#383838"/>
  <ellipse cx="38" cy="92" rx="3.5" ry="2.5" fill="#383838"/>
  <ellipse cx="54" cy="108" rx="4" ry="2.5" fill="#383838"/>

  <!-- HIND LEGS (Kicking back in full dynamic extension) -->
  <!-- Far hind leg -->
  <path d="M 74 122 L 46 142 L 32 154 C 30 157, 40 162, 44 158 L 62 140 L 78 130"
        fill="#ffffff" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Near hind leg -->
  <path d="M 66 116 L 36 134 L 22 144 C 20 147, 28 152, 34 148 L 52 130 L 70 120"
        fill="#ffffff" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="24" y1="148" x2="28" y2="145" stroke="#383838" stroke-width="1.5" stroke-linecap="round"/>

  <!-- STRETCHED TORSO & BELLY (Aerodynamic leaping arch) -->
  <path d="M 66 116
           C 74 98, 94 82, 124 76
           C 128 88, 126 102, 116 110
           C 98 120, 80 124, 66 116 Z"
        fill="#ffffff"
        stroke="#383838"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Elongated motion rosettes on body -->
  <ellipse cx="80" cy="112" rx="4.5" ry="2" transform="rotate(-25 80 112)" fill="#383838"/>
  <ellipse cx="88" cy="105" rx="5" ry="2.5" transform="rotate(-25 88 105)" fill="#383838"/>
  <ellipse cx="94" cy="112" rx="4" ry="2" transform="rotate(-25 94 112)" fill="#383838"/>
  <ellipse cx="104" cy="98" rx="5.5" ry="2.5" transform="rotate(-25 104 98)" fill="#383838"/>
  <ellipse cx="112" cy="104" rx="4.5" ry="2" transform="rotate(-25 112 104)" fill="#383838"/>

  <!-- FORELEGS (Reaching forward in flight) -->
  <!-- Back foreleg -->
  <path d="M 120 94 L 148 112 L 162 116 C 165 117, 168 113, 165 109 L 148 98 L 126 86"
        fill="#ffffff" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="160" y1="112" x2="164" y2="114" stroke="#383838" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Front lead foreleg (fully outstretched) -->
  <path d="M 124 88 L 158 80 L 178 84 C 182 86, 183 90, 178 92 L 156 94 L 122 102"
        fill="#ffffff" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="176" y1="87" x2="180" y2="88" stroke="#383838" stroke-width="1.5" stroke-linecap="round"/>

  <!-- COLLAR & TRAILING TAG -->
  <polygon points="120,72 128,68 132,77 124,81" fill="#ffde00" stroke="#383838" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Trailing tag flutter -->
  <polygon points="120,80 114,88 118,90 123,82" fill="#ffde00" stroke="#383838" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="118" cy="86" r="1.5" fill="#383838"/>

  <!-- HEAD & EARS (Aerodynamic, focused forward) -->
  <!-- Swept-back ears -->
  <!-- Left ear -->
  <path d="M 120 54 C 110 44, 114 34, 126 38 C 130 40, 132 50, 130 56"
        fill="#ffffff" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 118 39 C 122 36, 125 37, 126 38" stroke="#383838" stroke-width="3" stroke-linecap="round"/>

  <!-- Right ear -->
  <path d="M 136 48 C 138 34, 148 30, 154 38 C 156 42, 150 50, 144 54"
        fill="#ffffff" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 148 34 C 151 35, 153 37, 154 38" stroke="#383838" stroke-width="3" stroke-linecap="round"/>

  <!-- Head shape -->
  <path d="M 124 54
           C 134 46, 150 48, 158 54
           C 168 62, 168 76, 158 84
           C 146 92, 132 90, 122 80
           C 116 72, 118 60, 124 54 Z"
        fill="#ffffff"
        stroke="#383838"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Forehead spots -->
  <circle cx="134" cy="54" r="2" fill="#383838"/>
  <circle cx="140" cy="52" r="2" fill="#383838"/>
  <circle cx="146" cy="54" r="2" fill="#383838"/>

  <!-- EYES (Determined forward focus sky blue #54b4de) -->
  <ellipse cx="144" cy="64" rx="7" ry="6" transform="rotate(10 144 64)" fill="#54b4de" stroke="#383838" stroke-width="2"/>
  <ellipse cx="145" cy="64" rx="4" ry="5" transform="rotate(10 145 64)" fill="#383838"/>
  <circle cx="143" cy="62" r="1.5" fill="#ffffff"/>

  <!-- Secondary eye peek -->
  <ellipse cx="128" cy="62" rx="4" ry="5" fill="#54b4de" stroke="#383838" stroke-width="1.5"/>
  <circle cx="129" cy="62" r="2.5" fill="#383838"/>

  <!-- NOSE & CONFIDENT SMILE -->
  <polygon points="160,70 164,66 157,66" fill="#383838" stroke="#383838" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 158 70 L 157 74" stroke="#383838" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 152 74 C 155 77, 158 75, 160 73" stroke="#383838" stroke-width="2" stroke-linecap="round"/>

  <!-- Whiskers streaming back in wind -->
  <line x1="156" y1="72" x2="146" y2="76" stroke="#383838" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="156" y1="75" x2="148" y2="82" stroke="#383838" stroke-width="1.5" stroke-linecap="round"/>
</svg>
