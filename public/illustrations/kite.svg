  <path d="M 76 22 C 93 35 110 49 126 62 C 109 63 93 65 76 66 C 59 65 43 63 26 62 C 43 49 59 35 76 22 Z"
        fill="#ffde00" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
