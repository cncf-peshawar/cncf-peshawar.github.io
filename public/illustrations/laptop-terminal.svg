  <!-- Base Table Shadow / Desk line -->
  <path d="M 12 122 C 40 123 120 123 148 122"
        stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 34 126 C 54 127 106 127 126 126"
