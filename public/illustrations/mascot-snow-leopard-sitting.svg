<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" aria-hidden="true">
  <title>CNCF Peshawar snow leopard mascot</title>

  <!-- Ground sketch marks -->
  <path d="M 32 184 C 65 185, 135 185, 168 184" stroke="#383838" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 54 190 L 80 190" stroke="#383838" stroke-width="2" stroke-linecap="round"/>

  <!-- HIND HAUNCHES (Folded comfortably in seated posture) -->
  <!-- Left hip/thigh -->
  <path d="M 64 124 C 44 134, 42 162, 54 176 C 60 180, 74 180, 80 176"
        fill="#ffffff" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left hip rosettes -->
  <circle cx="52" cy="144" r="3" fill="#383838"/>
  <circle cx="58" cy="142" r="2.5" fill="#383838"/>
  <circle cx="54" cy="150" r="2.5" fill="#383838"/>

  <!-- Right hip/thigh -->
  <path d="M 136 124 C 156 134, 158 162, 146 176 C 140 180, 126 180, 120 176"
        fill="#ffffff" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right hip rosettes -->
  <circle cx="148" cy="144" r="3" fill="#383838"/>
  <circle cx="142" cy="142" r="2.5" fill="#383838"/>
  <circle cx="146" cy="150" r="2.5" fill="#383838"/>

  <!-- UPRIGHT TORSO -->
  <path d="M 74 98
           C 66 112, 68 140, 72 160
           L 128 160
           C 132 140, 134 112, 126 98 Z"
        fill="#ffffff"
        stroke="#383838"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- FRONT PAWS (Neatly together, attentive) -->
  <!-- Left front leg & paw -->
  <path d="M 80 114 L 80 172 C 80 176, 96 176, 96 172 L 96 128"
        fill="#ffffff" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="85" y1="170" x2="85" y2="175" stroke="#383838" stroke-width="2" stroke-linecap="round"/>
  <line x1="91" y1="170" x2="91" y2="175" stroke="#383838" stroke-width="2" stroke-linecap="round"/>

  <!-- Right front leg & paw -->
  <path d="M 104 128 L 104 172 C 104 176, 120 176, 120 172 L 120 114"
        fill="#ffffff" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="109" y1="170" x2="109" y2="175" stroke="#383838" stroke-width="2" stroke-linecap="round"/>
  <line x1="115" y1="170" x2="115" y2="175" stroke="#383838" stroke-width="2" stroke-linecap="round"/>

  <!-- TAIL (Curled completely around the paws in front) -->
  <path d="M 48 160
           C 40 174, 52 184, 80 184
           C 114 184, 150 184, 166 176
           C 176 168, 172 150, 160 148
           C 148 146, 146 160, 154 166
           C 146 170, 120 172, 86 172
           C 66 172, 54 168, 56 160 Z"
        fill="#ffffff"
        stroke="#383838"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <!-- Tail spots along the curl -->
  <circle cx="70" cy="179" r="2.5" fill="#383838"/>
  <circle cx="96" cy="179" r="3" fill="#383838"/>
  <circle cx="124" cy="179" r="3" fill="#383838"/>
  <circle cx="150" cy="175" r="2.5" fill="#383838"/>
  <circle cx="162" cy="158" r="3" fill="#383838"/>

  <!-- Chest white bib line -->
  <path d="M 88 102 C 88 116, 112 116, 112 102" stroke="#383838" stroke-width="1.5" stroke-linecap="round"/>

  <!-- COLLAR & CHARM TAG -->
  <rect x="74" y="93" width="52" height="9" rx="2" fill="#ffde00" stroke="#383838" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="100,102 106,109 100,116 94,109" fill="#ffde00" stroke="#383838" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="100" cy="109" r="2" fill="#383838"/>

  <!-- HEAD & EARS (Attentive, tilted slightly up) -->
  <!-- Left ear -->
  <path d="M 70 46 C 64 30, 68 18, 80 23 C 86 26, 86 38, 84 44"
        fill="#ffffff" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 70 25 C 74 22, 78 23, 80 23" stroke="#383838" stroke-width="3" stroke-linecap="round"/>
  <path d="M 74 32 C 74 28, 78 28, 80 32" stroke="#383838" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right ear -->
  <path d="M 130 46 C 136 30, 132 18, 120 23 C 114 26, 114 38, 116 44"
        fill="#ffffff" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 130 25 C 126 22, 122 23, 120 23" stroke="#383838" stroke-width="3" stroke-linecap="round"/>
  <path d="M 126 32 C 126 28, 122 28, 120 32" stroke="#383838" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Head outline -->
  <path d="M 84 40
           C 92 36, 108 36, 116 40
           C 130 44, 140 56, 140 70
           C 140 84, 128 95, 100 95
           C 72 95, 60 84, 60 70
           C 60 56, 70 44, 84 40 Z"
        fill="#ffffff"
        stroke="#383838"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Forehead spots -->
  <circle cx="95" cy="44" r="2" fill="#383838"/>
  <circle cx="100" cy="42" r="2.5" fill="#383838"/>
  <circle cx="105" cy="44" r="2.5" fill="#383838"/>
  <circle cx="92" cy="50" r="2" fill="#383838"/>
  <circle cx="108" cy="50" r="2" fill="#383838"/>

  <!-- EYES (Attentive wide circular sky blue #54b4de) -->
  <circle cx="84" cy="62" r="8" fill="#54b4de" stroke="#383838" stroke-width="2"/>
  <circle cx="84" cy="62" r="4.5" fill="#383838"/>
  <circle cx="82" cy="59" r="2" fill="#ffffff"/>

  <circle cx="116" cy="62" r="8" fill="#54b4de" stroke="#383838" stroke-width="2"/>
  <circle cx="116" cy="62" r="4.5" fill="#383838"/>
  <circle cx="114" cy="59" r="2" fill="#ffffff"/>

  <!-- NOSE & MUZZLE -->
  <polygon points="100,73 105,68 95,68" fill="#383838" stroke="#383838" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M 100 73 L 100 78" stroke="#383838" stroke-width="2" stroke-linecap="round"/>
  <path d="M 94 77 C 96 81, 100 81, 100 78 C 100 81, 104 81, 106 77" stroke="#383838" stroke-width="2" stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="74" y1="73" x2="62" y2="71" stroke="#383838" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="74" y1="77" x2="62" y2="79" stroke="#383838" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="126" y1="73" x2="138" y2="71" stroke="#383838" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="126" y1="77" x2="138" y2="79" stroke="#383838" stroke-width="1.5" stroke-linecap="round"/>
</svg>
