<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" fill="none" aria-hidden="true">
  <!-- Sun rising behind the pass -->
  <circle cx="90" cy="46" r="18" fill="#ffde00" stroke="#383838" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 90 20 L 90 14" stroke="#383838" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 108 26 L 114 20" stroke="#383838" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 72 26 L 66 20" stroke="#383838" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Distant mountain peaks (Sky blue strokes) -->
  <path d="M 28 85 L 56 48 L 86 78" stroke="#54b4de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 94 78 L 126 42 L 158 85" stroke="#54b4de" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left Pass Peak (Rugged Khyber cliff) -->
  <path d="M 10 108 L 22 75 L 42 42 L 62 66 L 76 88 L 82 108"
        stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left cliff ridge hatching -->
  <path d="M 42 42 L 46 72 L 58 108" stroke="#383838" stroke-width="2" stroke-linecap="round"/>
  <path d="M 30 65 L 44 80" stroke="#383838" stroke-width="2" stroke-linecap="round"/>
  <path d="M 20 88 L 32 98" stroke="#383838" stroke-width="2" stroke-linecap="round"/>

  <!-- Right Pass Peak (Towering mountain ridge) -->
  <path d="M 98 108 L 106 84 L 124 50 L 140 68 L 154 58 L 172 108"
        stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right cliff ridge hatching -->
  <path d="M 124 50 L 128 78 L 138 108" stroke="#383838" stroke-width="2" stroke-linecap="round"/>
  <path d="M 136 70 L 150 86" stroke="#383838" stroke-width="2" stroke-linecap="round"/>
  <path d="M 152 76 L 164 92" stroke="#383838" stroke-width="2" stroke-linecap="round"/>

  <!-- Winding canyon pass road through the center -->
  <polygon points="76,108 88,72 96,72 98,108" fill="#ff9538" stroke="#383838" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="85,96 89,84 92,84 88,96" fill="#ffde00"/>

  <!-- Ground base line -->
  <path d="M 6 108 L 174 108" stroke="#383838" stroke-width="2.5" stroke-linecap="round"/>
</svg>
