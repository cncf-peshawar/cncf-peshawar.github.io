<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" aria-hidden="true">
  <title>CNCF Peshawar snow leopard mascot</title>

  <!-- Ground sketch marks -->
  <path d="M 40 182 C 70 183, 130 183, 160 182" stroke="#383838" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 64 188 L 88 188" stroke="#383838" stroke-width="2" stroke-linecap="round"/>
  <path d="M 116 188 L 140 188" stroke="#383838" stroke-width="2" stroke-linecap="round"/>

  <!-- TAIL (Thick, fluffy, curving up on left) -->
  <path d="M 68 142
           C 40 146, 22 134, 20 106
           C 18 84, 34 76, 42 82
           C 50 88, 44 104, 38 114
           C 36 126, 48 134, 72 132 Z"
        fill="#ffffff"
        stroke="#383838"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <!-- Rosette spots on tail -->
  <circle cx="28" cy="98" r="3" fill="#383838"/>
  <circle cx="34" cy="94" r="2.5" fill="#383838"/>
  <circle cx="31" cy="116" r="3" fill="#383838"/>
  <circle cx="38" cy="118" r="2.5" fill="#383838"/>
  <circle cx="48" cy="132" r="3.5" fill="#383838"/>
  <circle cx="56" cy="135" r="2.5" fill="#383838"/>

  <!-- HIND LEGS (Behind front body) -->
  <!-- Left hind leg -->
  <path d="M 58 130 C 52 144, 52 164, 56 178 C 58 181, 72 181, 74 178 L 74 160"
        fill="#ffffff" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right hind leg -->
  <path d="M 142 130 C 148 144, 148 164, 144 178 C 142 181, 128 181, 126 178 L 126 160"
        fill="#ffffff" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- MAIN BODY (Torso & Belly) -->
  <path d="M 72 96
           C 62 108, 60 134, 64 156
           C 66 164, 82 166, 92 166
           C 108 166, 124 164, 126 156
           C 130 134, 128 108, 118 96 Z"
        fill="#ffffff"
        stroke="#383838"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- FRONT LEGS & PAWS (Confident, grounded stance) -->
  <!-- Left front leg -->
  <path d="M 76 112 L 74 176 C 74 180, 92 180, 92 176 L 90 126"
        fill="#ffffff" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left paw toe splits -->
  <line x1="80" y1="174" x2="80" y2="179" stroke="#383838" stroke-width="2" stroke-linecap="round"/>
  <line x1="86" y1="174" x2="86" y2="179" stroke="#383838" stroke-width="2" stroke-linecap="round"/>

  <!-- Right front leg -->
  <path d="M 114 126 L 112 176 C 112 180, 130 180, 130 176 L 128 112"
        fill="#ffffff" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right paw toe splits -->
  <line x1="118" y1="174" x2="118" y2="179" stroke="#383838" stroke-width="2" stroke-linecap="round"/>
  <line x1="124" y1="174" x2="124" y2="179" stroke="#383838" stroke-width="2" stroke-linecap="round"/>

  <!-- Snow-white chest bib -->
  <path d="M 86 100 C 86 114, 114 114, 114 100" stroke="#383838" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Body Rosette spots (Geometric pod clusters) -->
  <!-- Left flank rosettes -->
  <circle cx="68" cy="122" r="3" fill="#383838"/>
  <circle cx="73" cy="119" r="2.5" fill="#383838"/>
  <circle cx="70" cy="126" r="2.5" fill="#383838"/>
  <circle cx="66" cy="144" r="3" fill="#383838"/>
  <circle cx="71" cy="147" r="2.5" fill="#383838"/>
  <!-- Right flank rosettes -->
  <circle cx="132" cy="122" r="3" fill="#383838"/>
  <circle cx="127" cy="119" r="2.5" fill="#383838"/>
  <circle cx="130" cy="126" r="2.5" fill="#383838"/>
  <circle cx="134" cy="144" r="3" fill="#383838"/>
  <circle cx="129" cy="147" r="2.5" fill="#383838"/>

  <!-- COLLAR & CHARM TAG -->
  <rect x="74" y="92" width="52" height="9" rx="2" fill="#ffde00" stroke="#383838" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Diamond tag -->
  <polygon points="100,101 106,108 100,115 94,108" fill="#ffde00" stroke="#383838" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="100" cy="108" r="2" fill="#383838"/>

  <!-- HEAD & EARS -->
  <!-- Left ear -->
  <path d="M 72 48 C 66 32, 70 20, 82 25 C 88 28, 88 40, 86 46"
        fill="#ffffff" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left ear tip spot & inner notch -->
  <path d="M 72 27 C 76 24, 80 25, 82 25" stroke="#383838" stroke-width="3" stroke-linecap="round"/>
  <path d="M 76 34 C 76 30, 80 30, 82 34" stroke="#383838" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right ear -->
  <path d="M 128 48 C 134 32, 130 20, 118 25 C 112 28, 112 40, 114 46"
        fill="#ffffff" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right ear tip spot & inner notch -->
  <path d="M 128 27 C 124 24, 120 25, 118 25" stroke="#383838" stroke-width="3" stroke-linecap="round"/>
  <path d="M 124 34 C 124 30, 120 30, 118 34" stroke="#383838" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Head outline (Friendly, rounded feline face) -->
  <path d="M 84 42
           C 92 38, 108 38, 116 42
           C 130 46, 140 58, 140 72
           C 140 86, 128 96, 100 96
           C 72 96, 60 86, 60 72
           C 60 58, 70 46, 84 42 Z"
        fill="#ffffff"
        stroke="#383838"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Forehead spots -->
  <circle cx="95" cy="46" r="2" fill="#383838"/>
  <circle cx="100" cy="44" r="2.5" fill="#383838"/>
  <circle cx="105" cy="46" r="2" fill="#383838"/>
  <circle cx="92" cy="52" r="2" fill="#383838"/>
  <circle cx="108" cy="52" r="2" fill="#383838"/>

  <!-- EYES (Sky blue #54b4de) -->
  <!-- Left eye -->
  <ellipse cx="84" cy="62" rx="7" ry="9" fill="#54b4de" stroke="#383838" stroke-width="2"/>
  <ellipse cx="84" cy="62" rx="4" ry="7" fill="#383838"/>
  <circle cx="82" cy="59" r="2" fill="#ffffff"/>
  <!-- Right eye -->
  <ellipse cx="116" cy="62" rx="7" ry="9" fill="#54b4de" stroke="#383838" stroke-width="2"/>
  <ellipse cx="116" cy="62" rx="4" ry="7" fill="#383838"/>
  <circle cx="114" cy="59" r="2" fill="#ffffff"/>

  <!-- NOSE & MUZZLE -->
  <!-- Nose (charcoal rounded triangle) -->
  <polygon points="100,74 105,69 95,69" fill="#383838" stroke="#383838" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Muzzle smile line -->
  <path d="M 100 74 L 100 79" stroke="#383838" stroke-width="2" stroke-linecap="round"/>
  <path d="M 94 78 C 96 82, 100 82, 100 79 C 100 82, 104 82, 106 78" stroke="#383838" stroke-width="2" stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="74" y1="74" x2="62" y2="72" stroke="#383838" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="74" y1="78" x2="62" y2="80" stroke="#383838" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="126" y1="74" x2="138" y2="72" stroke="#383838" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="126" y1="78" x2="138" y2="80" stroke="#383838" stroke-width="1.5" stroke-linecap="round"/>
</svg>
