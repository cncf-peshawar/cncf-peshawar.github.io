  <path d="M130 22 L136 16" stroke="#383838" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M136 38 L142 38" stroke="#383838" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M96 22 L92 18" stroke="#383838" stroke-width="2.5" stroke-linecap="round"/>

