<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" aria-hidden="true">
  <!-- Ground sketch marks -->
  <path d="M 16 148 C 40 149, 120 149, 146 148" stroke="#383838" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 34 154 L 64 154" stroke="#383838" stroke-width="2" stroke-linecap="round"/>
  <path d="M 104 154 L 132 154" stroke="#383838" stroke-width="2" stroke-linecap="round"/>

  <!-- BOTTOM LEFT CONTAINER -->
  <!-- Top Face -->
  <polygon points="50,78 78,92 50,106 22,92" fill="#ffde00" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left Face -->
  <polygon points="22,92 50,106 50,142 22,128" fill="none" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Face -->
  <polygon points="50,106 78,92 78,128 50,142" fill="#ff9538" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Corrugated ridges on left face -->
  <line x1="31" y1="99" x2="31" y2="133" stroke="#383838" stroke-width="2" stroke-linecap="round"/>
  <line x1="41" y1="104" x2="41" y2="138" stroke="#383838" stroke-width="2" stroke-linecap="round"/>

  <!-- BOTTOM RIGHT CONTAINER -->
  <!-- Top Face -->
  <polygon points="110,78 138,92 110,106 82,92" fill="#ff9538" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left Face -->
  <polygon points="82,92 110,106 110,142 82,128" fill="#ffde00" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Face -->
  <polygon points="110,106 138,92 138,128 110,142" fill="none" stroke="#54b4de" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Door lines on right face -->
  <line x1="124" y1="101" x2="124" y2="135" stroke="#54b4de" stroke-width="2" stroke-linecap="round"/>
  <line x1="117" y1="118" x2="120" y2="119" stroke="#54b4de" stroke-width="2.5" stroke-linecap="round"/>

  <!-- TOP CONTAINER (Stacked on top) -->
  <!-- Top Face -->
  <polygon points="80,18 108,32 80,46 52,32" fill="#ffde00" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left Face -->
  <polygon points="52,32 80,46 80,82 52,68" fill="#ff9538" stroke="#383838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Face -->
  <polygon points="80,46 108,32 108,68 80,82" fill="none" stroke="#54b4de" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ridges on left face -->
  <line x1="61" y1="39" x2="61" y2="73" stroke="#383838" stroke-width="2" stroke-linecap="round"/>
  <line x1="71" y1="44" x2="71" y2="78" stroke="#383838" stroke-width="2" stroke-linecap="round"/>
  <!-- Handle/latch detail on right face -->
  <line x1="94" y1="41" x2="94" y2="75" stroke="#54b4de" stroke-width="2" stroke-linecap="round"/>

  <!-- Accent float sparks -->
  <path d="M 36 28 L 42 22 M 42 28 L 36 22" stroke="#54b4de" stroke-width="2" stroke-linecap="round"/>
  <circle cx="128" cy="24" r="3" fill="#ffde00"/>
</svg>
