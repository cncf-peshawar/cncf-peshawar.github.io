name: Scheduled OCG Event Sync

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "event-sync"
  cancel-in-progress: false

jobs:
  sync-events:
    name: Sync OCG Events
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run OCG Event Synchronization
        run: node scripts/sync-ocg-events.mjs

      - name: Validate Astro Content Schema
        run: npm run check

      - name: Create Pull Request for Event Sync
        uses: peter-evans/create-pull-request@v6
        id: cpr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(events): sync OCG events [skip ci]"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          branch: "automated/ocg-events-sync"
          delete-branch: true
          title: "chore(events): sync OCG events"
          body: |
            ## 🔄 Automated OCG Event Sync

            This pull request was automatically generated by the [Scheduled OCG Event Sync](https://github.com/${{ github.repository }}/actions/workflows/event-sync.yml) workflow.

            ### 📝 Changes Summary
            Synchronized event metadata from the official Open Community Groups (OCG) portal into `src/content/events`.

            - **Validation:** Astro Content Schema check (`npm run check`) passed.
            - **Scope:** Restricted to `src/content/events/`.

            Please review and merge when ready.
          # Stage changes only in src/content/events: git add src/content/events
          add-paths: |
            src/content/events
          labels: |
            events
            automated-pr

      - name: Check PR Status
        if: steps.cpr.outputs.pull-request-number
        run: |
          echo "Automated event sync pull request #${{ steps.cpr.outputs.pull-request-number }} created/updated."
          echo "PR URL: ${{ steps.cpr.outputs.pull-request-url }}"
